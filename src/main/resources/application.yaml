spring:
  application:
    name: stay-booking

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  modulith:
    detection-strategy: explicitly-annotated

app:
  jwt:
    issuer: stay-booking
    ttl: PT1H
    secret-base64: ${JWT_SECRET_BASE64:}

springdoc:
  paths-to-match: /api/**

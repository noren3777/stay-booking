services:
  postgres:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_DB: staybooking
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d staybooking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
